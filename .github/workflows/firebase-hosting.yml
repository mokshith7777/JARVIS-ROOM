name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Validate and deploy JARVIS ROOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate modular website and assemble intro video
        run: node scripts/validate-studio.mjs
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in public/js/*.js; do node --check --input-type=module < "$file"; done
      - name: Validate Firebase service-account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423 }}
        shell: bash
        run: |
          node <<'NODE'
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT || '';
          if (!raw.trim()) { console.error('::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423.'); process.exit(1); }
          let account;
          try { account = JSON.parse(raw); }
          catch { console.error('::error::Firebase secret is not valid raw JSON.'); process.exit(1); }
          const valid = account && account.type === 'service_account' &&
            account.project_id === 'jarvis-studio-f0423' &&
            typeof account.client_email === 'string' &&
            account.client_email.endsWith('.iam.gserviceaccount.com') &&
            typeof account.private_key === 'string' &&
            account.private_key.includes('BEGIN PRIVATE KEY');
          if (!valid) { console.error('::error::Firebase secret is not a complete service-account key for jarvis-studio-f0423.'); process.exit(1); }
          console.log('Firebase service-account structure and project ID validated without printing the secret.');
          NODE
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423 }}
          projectId: jarvis-studio-f0423
          target: jarvis-room
          channelId: live
      - name: Verify live Firebase content matches this GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://jarvis-studio-mokshith.web.app/"
          live_file="$(mktemp)"
          trap 'rm -f "$live_file"' EXIT
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --location --compressed "${url}?github_deploy=${GITHUB_SHA}" -o "$live_file"; then
              if cmp -s public/index.html "$live_file"; then
                echo "Firebase Hosting serves the exact index.html from commit ${GITHUB_SHA}."
                exit 0
              fi
            fi
            echo "Live content has not matched yet (attempt ${attempt}/6). Retrying..."
            sleep 5
          done
          echo "::error::Firebase Hosting did not serve the exact index.html from this GitHub commit."
          exit 1
