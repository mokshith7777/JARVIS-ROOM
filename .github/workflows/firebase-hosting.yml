name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy JARVIS ROOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate website files and inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html || { echo "::error::public/index.html is missing or empty."; exit 1; }
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('public/index.html', 'utf8');
          if (!/<!doctype html>/i.test(html)) throw new Error('public/index.html is missing its HTML doctype.');
          if (!/<title[^>]*>\s*[^<]+\s*<\/title>/i.test(html)) throw new Error('public/index.html is missing a non-empty title.');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script\s*>/gi)];
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const source = match[1].trim();
            if (!source) continue;
            new vm.Script(source, { filename: `public/index.html:inline-script-${index + 1}` });
            checked++;
          }
          console.log(`Website file validated; ${checked} inline script(s) passed syntax checks.`);
          NODE

      - name: Validate Firebase service-account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423 }}
        shell: bash
        run: |
          node <<'NODE'
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT || '';
          if (!raw.trim()) {
            console.error('::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423.');
            process.exit(1);
          }
          let account;
          try {
            account = JSON.parse(raw);
          } catch {
            console.error('::error::Firebase secret is not valid raw JSON. Replace it with the complete contents of the downloaded Firebase service-account .json file. Do not add quotes, Markdown fences, or base64 encoding.');
            process.exit(1);
          }
          const valid =
            account &&
            account.type === 'service_account' &&
            account.project_id === 'jarvis-studio-f0423' &&
            typeof account.client_email === 'string' &&
            account.client_email.endsWith('.iam.gserviceaccount.com') &&
            typeof account.private_key === 'string' &&
            account.private_key.includes('BEGIN PRIVATE KEY');
          if (!valid) {
            console.error('::error::Firebase secret is valid JSON but is not a complete service-account key for project jarvis-studio-f0423.');
            process.exit(1);
          }
          console.log('Firebase service-account JSON structure and project ID validated. Secret contents were not printed.');
          NODE

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JARVIS_STUDIO_F0423 }}
          projectId: jarvis-studio-f0423
          target: jarvis-room
          channelId: live

      - name: Verify live Firebase content matches this GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://jarvis-room.web.app/"
          live_file="$(mktemp)"
          trap 'rm -f "$live_file"' EXIT

          for attempt in {1..6}; do
            if curl --fail --silent --show-error --location --compressed "${url}?github_deploy=${GITHUB_SHA}" -o "$live_file"; then
              if cmp -s public/index.html "$live_file"; then
                echo "Firebase Hosting is serving the exact public/index.html from commit ${GITHUB_SHA}."
                exit 0
              fi
            fi
            echo "Live content has not matched yet (attempt ${attempt}/6). Retrying..."
            sleep 5
          done

          echo "::error::Firebase Hosting did not serve the exact public/index.html from this GitHub commit."
          exit 1
